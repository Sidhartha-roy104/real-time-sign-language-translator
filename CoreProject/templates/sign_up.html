<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../static/index.css">
    <link rel="stylesheet" href="../static/signup.css">
    <link rel="shortcut icon" href="../static/img/favicon_1.ico" type="image/x-icon">
</head>

<body>
    <div class="nav_head" style="background: rgba(255,255,255,0.8);">
        <div class="nav_title">
            <h1 style="font-weight: 600; margin-top:25px;">Realtime Sign Language Translator</h1>
        </div>
        <div class="icons">
            <ul class="header-list">
                <li class="header-list-elements">
                    <a class="link-tag" href="https://github.com/Deva0813/Realtime-Communication-System" target="_blank">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="container py-5">
        <div class="row">
            <div class="col-lg-5 col-md-8 mx-auto shadow rounded-5">
                <form name="sign-form" action="/signup" method="post">
                    <h2 class="text-center fw-bold mb-3">Sign up</h2>
                    <div id="form_alerts">
                        {% if accept == "failed" %}
                            <div class="alert alert-danger">Fill all the fields</div>
                        {% elif accept == "exist" %}
                            <div class="alert alert-danger">Mail id already exist.</div>
                        {% elif accept == "success" %}
                            <div class="alert alert-success">Signed up successfully. Redirecting to login...</div>
                        {% endif %}
                    </div>

                    <div class="form-group mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" value="{{username}}" required>
                    </div>

                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" value="{{email}}" required>
                    </div>

                    <div class="form-group mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <div class="form-group mb-3">
                        <label for="inputRole" class="form-label">Role</label>
                        <select class="form-select" id="inputRole" name="inputRole">
                            <option selected value="">Select</option>
                            <option value="Software Engineer">Software Engineer</option>
                            <option value="Student">Student</option>
                            <option value="Teacher">Teacher</option>
                        </select>
                    </div>

                    <div class="form-group mb-3">
                        <label for="inputDisability" class="form-label">Disability</label>
                        <select class="form-select" id="inputDisability" name="inputDisability">
                            <option value="">Select</option>
                            <option value="Deaf & Dumb">Deaf & Dumb</option>
                            <option value="Normal">Normal</option>
                        </select>
                    </div>

                    <div class="form-group mb-3">
                        <label for="gender" class="form-label">Gender</label>
                        <select class="form-select" id="gender" name="gender">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div style="text-align:center;">
                        <button class="an" type="submit">Sign up</button><br>
                        Already a member? <a href="/">Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p id="copyrights" style="color: #fff; font-size:20px; text-align:center;"></p>
    </footer>
    <script>
        const d = new Date();
        document.getElementById("copyrights").innerHTML = "Copyright © " + d.getFullYear();
    </script>
</body>
</html>
